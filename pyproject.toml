[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-expert"
version = "0.1.0"
description = "An explainable procurement agent, starting with equipment classification and standardization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Project Maintainers"}]

[project.scripts]
procurement-classify = "procurement_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
